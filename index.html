<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfumes Elegantes</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
<header>
  <h1>Os melhores perfumes para você.</h1>
</header>
<section id="home" class="hero">
  <h2>Descubra fragrâncias exclusivas</h2>
  <p>Elegância e sofisticação em cada aroma</p>
</section>
<section id="produtos" class="produtos">
  <div class="produto">
    <img src="./img/81951 1.png" alt="Perfume Sedution">
    <h3>Homem Sagaz</h3>
    <p>Sedutor e baladeiro</p>
    <p>⭐⭐⭐⭐⭐</p>
    <p>R$ 145,00</p> 
    <button onclick="comprar('Homem Sagaz')">Comprar</button>
  </div>

  <div class="produto">
    <img src="./img/Frame 2.png" alt="Perfume Bleu de Chanel">
    <h3>Bleu de Chanel</h3>
    <p>Forte e marcante</p>
    <p>⭐⭐⭐⭐</p>
    <p>R$ 750,00</p>
    <button onclick="comprar('Bleu de Chanel')">Comprar</button>
  </div>

  <div class="produto">
    <img src="./img/Frame 3.png" alt="Sospiro Vibrato">
    <h3>Sospiro Vibrato</h3>
    <p>Refrescante e leve</p>
    <p>⭐⭐⭐⭐⭐</p>
    <p>R$ 1450,00</p>
    <button onclick="comprar('Sospiro Vibrato')">Comprar</button>
  </div>
</section>
<script src="./script.js"></script>
</body>
</html>
